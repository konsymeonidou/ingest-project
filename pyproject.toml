[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ingest-project"
dynamic = ["version"]
description = "Validation step for lab measurement files: check rows against rules, split clean and rejected"
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "Konstantina Symeonidou" }]
dependencies = ["pyyaml>=6.0,<7"]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9", "ruff>=0.6,<1"]

[project.scripts]
ingest-project = "ingest_project.cli:main"

[tool.setuptools.dynamic]
version = { attr = "ingest_project.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
